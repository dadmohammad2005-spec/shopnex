# Render Blueprint specification for ShopNex Full-Stack Application
# https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. Django REST Framework Backend Service (Free Web Service)
  # -------------------------------------------------------------
  - type: web
    name: shopnex-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com"

  # -------------------------------------------------------------
  # 2. React + Vite Frontend Service (Free Static Site)
  # -------------------------------------------------------------
  - type: web
    name: shopnex-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        # Set this to your backend service URL, e.g. https://shopnex-backend.onrender.com/api
        sync: false
